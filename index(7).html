<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Carga de Productos - Bucle While</title>

<!---

• Aplicar CSS. 
• Que cuando demos un click al botón de GUARDAR PRODUCTO, el cursor aparezca en 
el input de manera automática. 
• Que no me limite solo a cinco (05) productos como máximo, que sea para N 
productos.

--->
    <!-- CSS AGREGADO -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 30px;
        }

        h2 {
            color: #2563eb;
        }

        form {
            background-color: white;
            padding: 20px;
            width: 500px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        input {
            padding: 10px;
            width: 90%;
            margin-top: 5px;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        button {
            padding: 10px 15px;
            margin-right: 10px;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
        }

        button:first-of-type {
            background-color: #28a745;
        }

        button:last-of-type {
            background-color: #dc3545;
        }

        li {
            margin: 8px 0;
        }

        #estadoInventario {
            font-weight: bold;
            color: #2563eb;
        }
    </style>
</head>

<body>
    <h2>Registro de Productos en Inventario</h2>

    <form id="inventarioForm" onsubmit="return false;">

        <!-- AGREGADO: cantidad N -->
        <label for="capacidadInput">Cantidad máxima de productos:</label><br>
        <input type="number" id="capacidadInput" min="1" placeholder="Ej. 10"><br><br>
        <!------------------------------------------------------------------------------>

        <label for="productoInput">Nombre del Producto:</label><br>
        <input type="text" id="productoInput" placeholder="Ej. Teclado USB"><br><br>

        <button type="button" onclick="agregarProducto()">Guardar Producto</button>
        <button type="button" onclick="cerrarLote()">Finalizar Carga</button>
    </form>

    <h3>Productos Guardados en la Sesión:</h3>
    <ul id="listaProductos"></ul>
    <p id="estadoInventario"></p>

    <script>
        let inventario = [];

        // CAMBIADO: ya no se usa CAPACIDAD_MAXIMA = 5

        function agregarProducto()
        {
            let nombre = document.getElementById("productoInput").value;

            // AGREGADO: obtener cantidad N
            // parseInt = combierte un texto a un nuemro entero
            let capacidad = parseInt(document.getElementById("capacidadInput").value);

            // AGREGADO: validar cantidad N
            // sirve para validar que la cantidad de productos ingresada sea correcta.
            if (isNaN(capacidad) || capacidad < 1)
            {
                alert("Ingrese una cantidad válida de productos.");
                return;
            }
            //----------------------------------------------------------------------------

            
            if (nombre.trim() === "") // elimina los espacios al inicio y al final
            {
                alert("Ingrese un nombre válido de producto.");
                return;
            }

            // Se usa un bucle while para verificar la disponibilidad de espacio antes de insertar
            let espacioDisponible = true;
            let i = 0;

            while (i < inventario.length)
            {
                // CAMBIADO: ahora utiliza la cantidad N
                if (inventario.length >= capacidad)
                {
                    espacioDisponible = false;
                }
                i++;
            }

            // CAMBIADO: ahora utiliza la cantidad N
            if (espacioDisponible && inventario.length < capacidad)
            {
                inventario.push(nombre);
                document.getElementById("productoInput").value = "";
                mostrarLista();

                // AGREGADO: regresar automáticamente el cursor al input
                document.getElementById("productoInput").focus();
            }
            else
            {
                document.getElementById("estadoInventario").innerText =
                    "Límite de capacidad alcanzado (Máximo " +
                    capacidad +
                    " productos por lote).";
            }
        }

        function mostrarLista() {
            let listaHTML = document.getElementById("listaProductos");
            listaHTML.innerHTML = "";
            
            let index = 0;
            // Bucle while para recorrer la lista e imprimir los elementos en el HTML
            while (index < inventario.length)
            {
                let item = document.createElement("li");
                item.innerText = "Producto N° " + (index + 1) + ": " + inventario[index];
                listaHTML.appendChild(item);
                index++;
            }
        }

        function cerrarLote() {
            document.getElementById("estadoInventario").innerText =
                "Lote cerrado con " + inventario.length + " productos registrados.";
        }
    </script>

</body>
</html>
